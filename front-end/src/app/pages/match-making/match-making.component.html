<div class="d-flex">
  <app-sidebar></app-sidebar>
  <div class="container custom-container">
    <div class="content">
      <div class="d-flex mt-2">

        <div class="col-xl-4 col-lg-3 col-md-12 col-sm-12 col-12">
          <div class="sticky-card card nav-size">
            <nav>
              <a (click)="smoothScroll('#profile')">
                <div class="nav-links">
                  <svg xmlns="http://www.w3.org/2000/svg" class="nav-icons" viewBox="0 0 24 24" fill="currentColor"
                    aria-hidden="true" data-slot="icon" width="24">
                    <path fill-rule="evenodd"
                      d="M7.5 5.25a3 3 0 0 1 3-3h3a3 3 0 0 1 3 3v.205c.933.085 1.857.197 2.774.334 1.454.218 2.476 1.483 2.476 2.917v3.033c0 1.211-.734 2.352-1.936 2.752A24.726 24.726 0 0 1 12 15.75c-2.73 0-5.357-.442-7.814-1.259-1.202-.4-1.936-1.541-1.936-2.752V8.706c0-1.434 1.022-2.7 2.476-2.917A48.814 48.814 0 0 1 7.5 5.455V5.25Zm7.5 0v.09a49.488 49.488 0 0 0-6 0v-.09a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5Zm-3 8.25a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z"
                      clip-rule="evenodd"></path>
                    <path
                      d="M3 18.4v-2.796a4.3 4.3 0 0 0 .713.31A26.226 26.226 0 0 0 12 17.25c2.892 0 5.68-.468 8.287-1.335.252-.084.49-.189.713-.311V18.4c0 1.452-1.047 2.728-2.523 2.923-2.12.282-4.282.427-6.477.427a49.19 49.19 0 0 1-6.477-.427C4.047 21.128 3 19.852 3 18.4Z">
                    </path>
                  </svg>
                  Profile
                </div>
              </a>
              <a (click)="smoothScroll('#portfolio')">
                <div class="nav-links">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" aria-hidden="true" data-slot="icon" class="nav-icons" width="24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                      d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z">
                    </path>
                  </svg>
                  Portfolio
                </div>
              </a>
            </nav>
          </div>
        </div>


        <div class="col-xl-9 col-lg-9 col-md-12 col-sm-12 col-12">
          <!--entrepreneurs begin-->
          <div *ngIf="entrepreneurs.length > 0">
            <div *ngFor="let entrepreneur of entrepreneurs">
              <div class="card">
                <div class="card-body">
                  <div class="row gutters">
                    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                      <div class="d-flex">
                        <img *ngIf="entrepreneur.image_profile"
                          [src]="'http://localhost:4000/api/uploads/' + entrepreneur.image_profile"
                          alt="Entrepreneur Image" class="profile_picture">
                        <img *ngIf="!entrepreneur.image_profile" src="assets/images/3da39-no-user-image-icon-27.webp"
                          alt="Entrepreneur Image" class="profile_picture">
                        <div class="container">
                          <div class="match-name">{{entrepreneur.name}}</div>
                          <a class="Company-link" href="{{entrepreneur.website_url}}">{{entrepreneur.website_url}}</a>
                          <div class="d-flex">
                            <fa-icon [icon]="faLocationDot" *ngIf="entrepreneur.country || entrepreneur.city"
                              class="location-icon"></fa-icon>
                            <p class="location">{{entrepreneur.country}}</p>
                            <p class="location" *ngIf="entrepreneur.country">, &nbsp;</p>
                            <p class="location">{{entrepreneur.city}}</p>
                          </div>
                          <button (click)="navigateToPreviewProfile(entrepreneur._id)" class="view-profile-button">View
                            profile</button>
                        </div>
                      </div>
                      <hr class="text-gray">
                      <div class="match-bio">{{entrepreneur.description}}</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!--entrepreneurs end-->

          <div *ngIf="investors.length > 0">
            <div *ngFor="let investor of investors ">
              <div *ngIf="investor.score && investor.score > 0">
                <div class="card">
                  <div class="card-body">
                    <div class="row gutters">
                      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                        <div class="d-flex">
                          <img *ngIf="investor.image_profile"
                            [src]="'http://localhost:4000/api/uploads/' + investor.image_profile" alt="Investor Image"
                            class="profile_picture">
                          <img *ngIf="!investor.image_profile" src="assets/images/3da39-no-user-image-icon-27.webp"
                            alt="Investor Image" class="profile_picture">
                          <div class="container">
                            <div class="match-name">{{investor.name}}</div>
                            <div class="Company-link">{{investor.phone_number}}</div>
                            <div class="d-flex">
                              <fa-icon [icon]="faLocationDot" *ngIf="investor.country || investor.city"
                                class="location-icon"></fa-icon>
                              <p class="location">{{investor.country}}</p>
                              <p class="location" *ngIf="investor.country">, &nbsp;</p>
                              <p class="location">{{investor.city}}</p>
                            </div>
                            <button (click)="navigateToPreviewProfile(investor._id)" class="view-profile-button">View
                              profile</button>
                          </div>
                        </div>
                        <hr class="text-gray">
                        <div class="match-bio">{{investor.description}}</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
