<link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" />

<div class="container">
<div class="row clearfix">
    <div class="col-lg-12">
        <div class="card chat-app">
            <div id="plist" class="people-list">
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fa fa-search"></i></span>
                    </div>
                    <input type="text" class="form-control" placeholder="Search...">
                </div>
                <ul class="list-unstyled chat-list mt-2 mb-0" *ngFor="let conv of convList; let i = index">
                    <li class="clearfix" [class.active]="conv.active" (click)="getConv(conv,i)">
                        <img *ngIf="conv.image_profile" [src]="'http://localhost:4000/api/uploads/' + conv.image_profile" alt="avatar">
                        <img *ngIf="!conv.image_profile" src="assets/images/3da39-no-user-image-icon-27.webp" alt="avatar">
                        <div class="about">
                            <div class="name">{{conv.name}} <span *ngIf="unread[i]>0" class=" badge rounded-pill bg-danger" style="margin-left: 5px;">{{unread[i]}}</span></div>                                            
                        </div>
                    </li>
                    <!--<li class="clearfix active">
                        <img src="https://bootdey.com/img/Content/avatar/avatar2.png" alt="avatar">
                        <div class="about">
                            <div class="name">Aiden Chavez</div>
                            <div class="status"> <i class="fa fa-circle online"></i> online </div>
                        </div>
                      </li>-->
                </ul>
                
            </div>
            <div class="chat">
                <div class="chat-header clearfix">
                    <div class="row">
                        <div class="col-lg-6">
                            <a [href]="profileUrl" data-toggle="modal" data-target="#view_info">
                                <img [src]="image" alt="avatar">
                            </a>
                            <div class="chat-about">
                                <h6 class="m-b-0">{{name}}</h6>
                                <small>Last seen: 2 hours ago</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="chat-history" id="chat-history">
                    <ul class="m-b-0" *ngFor="let message of messages">
                        <li class="clearfix" *ngIf="message.senderId==userId">
                            <div class="message-data" style="margin-left: 85%;">
                                <span class="message-data-time">{{message.timestamp | date}}</span>
                            </div>
                            <div class="message other-message float-right"> {{message.message}} </div>
                        </li>
                        <li class="clearfix" *ngIf="message.senderId!=userId">
                            <div class="message-data">
                                <span class="message-data-time">{{message.timestamp | date }}</span>
                            </div>
                            <div class="message my-message">{{message.message}}</div>                                    
                        </li>                               
                    </ul>
                </div>
                <div class="chat-message clearfix">
                    <div class="input-group mb-0">
                        <div class="input-group-prepend" (click)="sendMessage()">
                            <span class="input-group-text"><i class="fa fa-send"></i></span>
                        </div>
                        <input type="text" [(ngModel)]="message" (keyup.enter)="sendMessage()" class="form-control" placeholder="Enter text here...">                                    
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
</div>
