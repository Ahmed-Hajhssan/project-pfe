        <div class="middle-panel">

            <div class="story-section mb-5">


            </div>

            <div class="post create">
                <form [formGroup]="posteForm" (ngSubmit)="onSubmit()">
                    <div class="post-top">
                        <div class="dp">
                            <img [src]="imageUrl" alt="profile picture">
                        </div>
                        <input type="text" formControlName="content"
                            placeholder="What's on your mind ?" />&nbsp;&nbsp;&nbsp;
                        <button type="submit" class="button-18">Post</button>
                    </div>
                </form>
                <div class="post-bottom justify-content-center">

                    <div class="action" (click)="toggleVisibility()">
                        <i class="fa fa-image"></i>
                        <span>Photo/Video</span>
                    </div>
                    <!--<div class="action">
                        <i class="fa fa-video"></i>
                        <span>Video</span>
                    </div> -->
                </div>
                <div class="justify-content-center post-dropzone mt-1">
                    <div *ngIf="isVisible" class="mt-3">
                        <div class="custom-dropzone" ngx-dropzone [accept]="'image/*'" (change)="onSelect($event)">
                            <ngx-dropzone-label>
                                <div>
                                    <h2>My custom dropzone</h2>
                                </div>
                            </ngx-dropzone-label>
                            <ngx-dropzone-image-preview ngProjectAs="ngx-dropzone-preview" *ngFor="let f of files" [file]="f" [removable]="true" (removed)="onRemove(f)">
                                <ngx-dropzone-label>{{ f.name }} ({{ f.type }})</ngx-dropzone-label>
                            </ngx-dropzone-image-preview>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container2">
                <input type="radio" name="slider" id="home" checked>
                <input type="radio" name="slider" id="blog">
                <nav>
                    <label for="home" class="home">Feed</label>
                    <label for="blog" class="blog">Your posts</label>
                    <div class="slider"></div>
                </nav>
                <section>
                    <div class="content content-1">
                        <div *ngIf="AllpostsExist">
                            <div *ngFor="let post of Allposts" class="post mb-4">
                                <div class="post-top">
                                    <div class="dp">
                                        <img [src]="baseUrl + '/api/uploads/' + post.image" alt="">
                                    </div>
                                    <div class="post-info">
                                        <p class="name">{{post.name}}</p>
                                        <span class="time">12 hrs ago</span>
                                    </div>
                                </div>

                                <div class="post-content">
                                    {{post.content}}
                                </div>

                                <div class="post-bottom">
                                    <div class="action">
                                        <i class="far fa-thumbs-up"></i>
                                        <span>Like</span>
                                    </div>
                                    <div class="action">
                                        <i class="far fa-comment"></i>
                                        <span>Comment</span>
                                    </div>
                                    <div class="action">
                                        <i class="fa fa-share"></i>
                                        <span>Share</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="content content-2">
                        <div *ngIf="postsExist">
                            <div *ngFor="let post of posts" class="post mb-4">
                                <div class="post-top">
                                    <div class="dp">
                                        <img [src]="imageUrl" alt="">
                                    </div>
                                    <div class="post-info">
                                        <p class="name">{{ Investor.name || Entreprenur.name}}</p>
                                        <span class="time">12 hrs ago</span>
                                    </div>
                                    <div class="dropdown">
                                        <div class="post-settings" style="margin-left: 405px;"><i
                                                class="fas fa-ellipsis-h"></i>
                                            <div class="dropdown-content">
                                                <a class="custom-button text-center" (click)="updatePost(post._id)"
                                                    data-bs-toggle="modal" data-bs-target="#edit-member">Update</a>
                                                <a class="text-center" (click)="deletePost(post._id)">Delete</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="post-content">
                                    {{post.content}}
                                </div>

                                <div class="post-bottom">
                                    <div class="action">
                                        <i class="far fa-thumbs-up"></i>
                                        <span>Like</span>
                                    </div>
                                    <div class="action">
                                        <i class="far fa-comment"></i>
                                        <span>Comment</span>
                                    </div>
                                    <div class="action">
                                        <i class="fa fa-share"></i>
                                        <span>Share</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

<!-- edit member -->
<div class="modal fade custom-modal3" id="edit-member" tabindex="-1" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog custom-dialog3 ">
        <div class="modal-content">
            <form [formGroup]="editPost" (ngSubmit)="editPostSubmit()">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Edit Post</h1>
                    <button type="button" class="btn-close mb-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body custom-body3">


                    <div class="row mb-4">
                        <div class="col-6">
                            <label for="content"></label>
                            <input formControlName="content" type="text" class="form-control custom-input"
                                placeholder="Post content">
                        </div>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>&nbsp; &nbsp;
                    <button type="submit" class="btn btn-outline-warning" data-bs-dismiss="modal">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
