<div class="wrapper">
  <aside id="sidebar">
    <div class="d-flex">
      <button class="toggle-btn" type="button">
        <i class="lni lni-menu"></i>
      </button>
      <div class="sidebar-logo">
        <a href="#">CodzSword</a>
      </div>
    </div>
    <hr>
    <ul class="sidebar-nav">
      <li class="sidebar-item">
        <a [href]="navigateToDashboard()" class="sidebar-link">
          <i class="lni lni-stats-up"></i>
          <span>Stats</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a [href]="navigateToUsersManagement()" class="sidebar-link">
          <i class="lni lni-users"></i>
          <span>Users</span>
        </a>
      </li>
    </ul>
    <hr>
    <div class="sidebar-footer">
      <a type="submit" (click)="logout()" class="sidebar-link">
        <i class="lni lni-exit"></i>
        <span>Logout</span>
      </a>
    </div>
  </aside>
</div>
