<app-header></app-header>
<div class="limiter">
	<!--style="background-image: url('../../assets/images/lakeside-pink-sky-sunset-minimal-art-gradient-background-7680x3215-4584.png');"-->
	<div class="container-login100">
		<div class="wrap-login100 p-l-55 p-r-55 p-t-65 p-b-54">
			<form class="login100-form validate-form" (ngSubmit)="onSubmit()" [formGroup]='loginForm'>
				<span class="login100-form-title p-b-49 mt-3 mb-5">
					<B>Login to your account</B>
				</span>
				<!-- Result-->
				<div id="success" class="text-success mb-1"></div>
				<div id="error" class="text-danger mb-1"></div>
				
				<div class="wrap-input100 validate-input m-b-23" data-validate="Username is reauired">
					<span class="label-input100" for="email">Email address</span>
					<input class="input100" type="text" formControlName="email" placeholder="Type your email address">
					<span class="focus-input100" data-symbol="&#xf206;"></span>
				</div>
				<!-- error -->
				<div class="text-danger" *ngIf="submitted && loginForm.controls['email'].errors?.['required']">
					Email is required.
				</div>
				<div class="text-danger" *ngIf="submitted && loginForm.controls['email'].errors?.['pattern']">
					Enter valid email.
				</div>

				<div class="wrap-input100 validate-input mt-3" data-validate="Password is required">
					<span class="label-input100" for="password">Password</span>
					<div class="password-input">
						<div class="d-flex">
							<input id="password-input" class="input100" type="password" formControlName="password"
								placeholder="Type your password">
							<span class="focus-input100" data-symbol="&#xf190;"></span>
							<fa-icon class="password-toggle mt-3" (click)="togglePasswordVisibility()"
								[icon]="showPassword ? faEye : faEyeSlash"></fa-icon>
						</div>
					</div>
				</div>
				<!-- error -->
				<div class="text-danger" *ngIf="submitted && loginForm.controls['password'].errors?.['required']">
					Password is required.
				</div>
				<div class="text-danger" *ngIf="submitted && loginForm.controls['password'].errors?.['minlength']">
					Enter valid password (at least 8 characters).
				</div>

				<div class="right-align mt-3">
					<a routerLink="/forget-password">
						Forgot password?
					</a>
				</div>

				<div class="container-login100-form-btn mt-4">
					<div class="wrap-login100-form-btn">
						<div class="login100-form-bgbtn"></div>
						<button class="login100-form-btn" type="submit">
							Log in
						</button>
					</div>
				</div>

				<!--<div class="txt1 text-center p-t-54 p-b-20 mt-3 mb-2">
					<span>
						Or Sign Up Using
					</span>
				</div>-->

				<div class="flex-c-m">
					<!--
						<a href="#" class="login100-social-item bg1">
						
							<img class="icon-image" src="../../assets/images/icons/facebook.png" alt="fb icon">
						</a>

						<a href="#" class="login100-social-item bg2">
							<img class="icon-image" src="../../assets/images/icons/twitter.png" alt="fb icon">
						</a>
-->
					<!--<a href="#" class="login100-social-item bg3">
						<img class="icon-image" src="../../assets/images/icons/google.png" alt="fb icon">
					</a>-->
				</div>


				<div class="flex-col-c p-t-155 mt-4 center-align">
					<span class="txt1 p-b-17">
						Don't have an account ?
					</span>

					<a routerLink="/sign-Up" class="txt2">
						Sign Up
					</a>
				</div>
			</form>
		</div>
	</div>
</div>


<div id="dropDownSelect1"></div>
