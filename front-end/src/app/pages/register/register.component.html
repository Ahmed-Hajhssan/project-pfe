<app-header></app-header>
<div class="limiter">
	<!--style="background-image: url('../../assets/images/lakeside-pink-sky-sunset-minimal-art-gradient-background-7680x3215-4584.png');"-->
	<div class="container-login100">
		<div class="wrap-login100 p-l-55 p-r-55 p-t-65 p-b-54">
			<form class="login100-form validate-form" (ngSubmit)="onSubmit()" [formGroup]='signupForm'>
				<span class="login100-form-title p-b-49  mb-5">
					<B>Subscribe</B>
				</span>
				<!--Result-->
				<div id="error" class="text-danger mb-1"></div>

				<div class="wrap-input100 validate-input m-b-23" data-validate="Username is required">
					<span class="label-input100" for="email">Business e-mail</span>
					<input class="input100" type="text" formControlName="email" placeholder="Type your email address" required>
					<span class="focus-input100" data-symbol="&#xf206;"></span>
				</div>
				<!-- error -->
				<div class="text-danger" *ngIf="submitted && signupForm.controls['email'].errors?.['required']">
					Email is required.
				</div>
				<div class="text-danger" *ngIf="submitted && signupForm.controls['email'].errors?.['pattern']">
					Enter valid email.
				</div>

				<div class="wrap-input100 validate-input" data-validate="Password is required">
					<span class="label-input100" for="password">Password</span>
					<div class="password-input">
						<div class="d-flex">
							<input id="password-input" class="input100" type="password" formControlName="password"
								placeholder="Type your password">
							<span class="focus-input100" data-symbol="&#xf190;"></span>
							<fa-icon class="password-toggle mt-3" (click)="togglePasswordVisibility()"
								[icon]="showPassword ? faEye : faEyeSlash"></fa-icon>
						</div>
					</div>
				</div>
				<!-- error -->
				<div class="text-danger" *ngIf="submitted && signupForm.controls['password'].errors?.['required']">
					Password is required.
				</div>
				<div class="text-danger" *ngIf="submitted && signupForm.controls['password'].errors?.['minlength']">
					Enter valid password (at least 8 characters).
				</div>
				<div class="wrap-input100 validate-input" data-validate="Password is required">
					<span class="label-input100" for="password">Confirm password</span>
					<div class="password-input">
						<div class="d-flex">
							<input id="confirm-password-input" formControlName="confirmPassword" class="input100" type="password"
								placeholder="Confirm your password">
							<span class="focus-input100" data-symbol="&#xf190;"></span>
							<fa-icon class="password-toggle mt-3" (click)="ConfirmPasswordVisibility()"
								[icon]="showConfirmPassword ? faEye : faEyeSlash"></fa-icon>
						</div>
					</div>
				</div>
				<div *ngIf="confirmPassword?.touched && confirmPassword?.errors?.['passwordMismatch']" class="text-danger">
					Passwords do not match.
				</div>
				<div class="row d-flex justify-content-center">
					<div class="col-3 form-check m-2 mt-4 ">
						<input id="investor-radio" formControlName="role" type="radio" value="investor" required
							class="form-check-input">
						<label for="investor-radio" class="form-check-label">Investor</label>
					</div>
					<div class="col-3 form-check m-2 mt-4">
						<input id="company-radio" formControlName="role" type="radio" value="entrepreneur" required
							class="form-check-input">
						<label for="company-radio" class="form-check-label">Company</label>
					</div>
				</div>
				<!-- error -->
				<div class="text-danger" *ngIf="submitted && signupForm.controls['role'].errors?.['required']">
					role is required.
				</div>

				<div class="checkbox-wrapper-1 m-2 mt-2">
					<input id="example-1" formControlName="GPDR" class="substituted" type="checkbox" aria-hidden="true"
						required />
					<label for="example-1"><small>I agree my personal data will be stored and processed for the purposes of online
							communication</small></label>
				</div>
				<!-- error -->
				<div class="text-danger" *ngIf="submitted && signupForm.controls['GPDR'].errors?.['required']">
					GPDR must be checked.
				</div>

				<div class="container-login100-form-btn mt-2">
					<div class="wrap-login100-form-btn">
						<div class="login100-form-bgbtn"></div>
						<button class="login100-form-btn" type="submit">
							Join
						</button>
					</div>
				</div>



				<div class="flex-col-c p-t-155 center-align mt-3">
					<span class="txt1 p-b-17">

					</span>

					<a routerLink="/login" class="txt2">
						Back to Login.
					</a>
				</div>
			</form>
		</div>
	</div>
</div>


<div id="dropDownSelect1"></div>

<script src="vendor/animsition/js/animsition.min.js"></script>

<script src="vendor/daterangepicker/daterangepicker.js"></script>
<!--===============================================================================================-->
<script src="vendor/countdowntime/countdowntime.js"></script>
<!--===============================================================================================-->
<script src="js/main.js"></script>
